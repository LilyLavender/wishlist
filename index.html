<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lily's Wishlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1><span class="flower" aria-hidden="true">✿</span> Lily's Wishlist</h1>

      <div class="about">
        <p>
          If you buy something, open it and click <span class="btn btn-primary btn-sm demo"><i class="bi bi-check2-square"></i> Mark as Purchased</span>.
          That hides it for everyone else, and <strong>I won't be able to see what was purchased!</strong>
        </p>
        <p>
          Made a mistake?
          <span class="btn btn-ghost btn-sm demo"><i class="bi bi-x-square"></i> Unmark</span> it as purchased.
        </p>
      </div>
    </header>

    <section class="controls" aria-label="Search and filter">
      <div class="controls-row">
        <label class="search">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input id="search" type="search" placeholder="Search wishes" autocomplete="off" aria-label="Search wishes">
        </label>
        <label class="sort">
          <span>Sort</span>
          <select id="sort">
            <option value="default">Default (most wanted)</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name: A to Z</option>
          </select>
        </label>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Category"></div>
    </section>

    <main>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty">Loading wishes…</p>
    </main>

    <footer class="footer">
      <button id="purchased-toggle" class="btn btn-ghost" aria-expanded="false" aria-controls="purchased">
        <i class="bi bi-bag-check"></i> Purchased items
      </button>
      <section id="purchased" class="purchased" hidden>
        <ul id="purchased-list" class="purchased-list"></ul>
      </section>
    </footer>
  </div>

  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" id="dialog-close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
    <div class="dialog-media" id="dialog-media"><img id="dialog-img" alt=""></div>
    <div class="dialog-body">
      <p id="dialog-category" class="eyebrow"></p>
      <h2 id="dialog-title"></h2>
      <div id="dialog-tags" class="tags"></div>
      <p id="dialog-notes" class="dialog-notes"></p>
      <ul id="dialog-list" class="dialog-list" hidden></ul>
      <div id="dialog-tried" hidden></div>
      <div class="dialog-actions">
        <a id="dialog-link" class="btn btn-primary" target="_blank" rel="noopener">Go to store <i class="bi bi-box-arrow-up-right"></i></a>
        <button id="dialog-mark" class="btn btn-ghost"><i class="bi bi-check2-square"></i> Mark as Purchased</button>
      </div>
    </div>
  </dialog>

  <!-- Firebase v8 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.0/firebase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.0/firebase-firestore.min.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyDxa4HXtjSH-_npR3EwcL22qqY2F5eLCpQ",
      authDomain: "wishlist-6eeb7.firebaseapp.com",
      projectId: "wishlist-6eeb7",
      storageBucket: "wishlist-6eeb7.firebasestorage.app",
      messagingSenderId: "106765746555",
      appId: "1:106765746555:web:2e920c446e8579ca22bdde"
    });
    window.db = firebase.firestore();
  </script>
  <script src="./script.js"></script>
</body>
</html>
